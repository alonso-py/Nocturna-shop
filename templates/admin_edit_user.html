{% extends "base.html" %}
{% block title %}Editar Usuario{% endblock %}

{% block content %}
<div class="admin-container">

    <div class="admin-header">
        <h2>Editar Usuarios</h2>
        <a href="/admin" class="btn-secondary">⬅ Volver al panel</a>
    </div>
</div>

<div class="form-container">



    <h2>Editar usuario</h2>

    <form method="POST" class="product-form">

        <div class="form-group">
            <label>Nombre</label>
            <input type="text" name="name" value="{{ user[1] }}" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ user[2] }}" required>
        </div>

        <div class="form-group">
            <label>Rol</label>
            <select name="role" required>
                <option value="buyer" {% if user[3]=='buyer' %}selected{% endif %}>Buyer</option>
                <option value="seller" {% if user[3]=='seller' %}selected{% endif %}>Seller</option>
                <option value="admin" {% if user[3]=='admin' %}selected{% endif %}>Admin</option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Guardar cambios</button>
        </div>

    </form>

</div>

{% endblock %}
