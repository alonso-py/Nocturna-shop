<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Producto | Seller</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<div class="seller-header">
    <div class="seller-title">Agregar Productos</div>
    <a href="/seller" class="back-link">⬅ Regresar</a>
</div>

<div class="form-container">

    <h2>Nuevo producto</h2>

    <form action="/add_product" method="POST" enctype="multipart/form-data" class="product-form">

        <div class="form-group">
            <label>Nombre del producto</label>
            <input type="text" name="name" placeholder="Ej. Audífonos Bluetooth" required>
        </div>

        <div class="form-group">
            <label>Precio</label>
            <input type="number" step="0.01" name="price" placeholder="Ej. 499.99" required>

        </div>


        <div class="form-group">
            <label>Stock</label>
            <input type="number" name="stock" min="0" placeholder="Ej. 10" required>
        </div>

        <div class="form-group">
            <label>Descripción</label>
            <textarea name="description" placeholder="Describe tu producto..." required></textarea>
        </div>

        <div class="form-group">
            <label>Categoría</label>
            <select name="category_id" required>
                <option value="">Selecciona una categoría</option>
                {% for c in categories %}
                <option value="{{ c[0] }}">{{ c[1] }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Imagen</label>
            <input type="file" name="image" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Guardar producto</button>
            <a href="/seller" class="btn-secondary">Cancelar</a>
        </div>

    </form>

</div>

</body>
</html>
