{% extends "base.html" %}
{% block title %}Agregar Producto{% endblock %}

{% block content %}

<div class="admin-container">

    <div class="admin-header">
        <h2>Agregar Producto</h2>
        <a href="/admin" class="btn-secondary">⬅ Volver al panel</a>
    </div>
</div>

<div class="form-container">

    <h2>Nuevo producto</h2>

    <form action="/add_product" method="POST"
          enctype="multipart/form-data"
          class="product-form">

        <div class="form-group">
            <label>Nombre del producto</label>
            <input type="text" name="name" placeholder="Ej. Audífonos Bluetooth" required>
        </div>

        <div class="form-group">
            <label>Precio</label>
            <input type="number" step="0.01" name="price" placeholder="Ej. 499.99" required>
        </div>

        <div class="form-group">
            <label>Descripción</label>
            <textarea name="description" placeholder="Describe el producto..."></textarea>
        </div>

        <div class="form-group">
            <label>Imagen del producto</label>
            <input type="file" name="image">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Guardar producto</button>
            <a href="/admin_dashboard" class="btn-secondary">Cancelar</a>
        </div>

    </form>

</div>

{% endblock %}
