<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 20px rgba(0,0,0,.25);
        }

        .img-box {
            height: 180px;
            background: #ddd;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #555;
        }

        .name {
            font-size: 20px;
            font-weight: bold;
        }

        .price {
            color: #008000;
            font-size: 19px;
            margin: 8px 0;
        }

        .description {
            font-size: 14px;
            color: #444;
            height: 50px;
            overflow: hidden;
        }

        .btn {
            margin-top: 15px;
            display: block;
            padding: 10px;
            text-align: center;
            background: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.2s;
        }

        .btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Catálogo de Productos</h1>

    <div class="grid">
        {% for product in products %}
        <div class="card">
            <div class="img-box">
                {% if product.image %}
                <img src="/static/uploads/{{ product.image }}" style="max-width:100%; max-height:100%; border-radius:10px; border:2px solid red;">
                {% else %}
                Sin imagen
                {% endif %}
            </div>

            <div class="name">{{ product.name }}</div>
            <div class="price">${{ product.price }}</div>
            <div class="description">{{ product.description }}</div>


            <a class="btn" href="/edit_product/{{ product.id }}">Editar</a>
            <a class="btn" href="/delete_product/{{ product.id }}" style="background: red;">Eliminar</a>
            <a class="btn" href="/product/{{ product.id }}">Ver más</a>
            <a class="btn" href="/seller">Regresar</a>
        </div>
        {% endfor %}
    </div>
</body>
</html>
